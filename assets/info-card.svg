<svg xmlns="http://www.w3.org/2000/svg" width="480" height="376" viewBox="0 0 480 376" role="img" font-family='"SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, "Cascadia Mono", "Roboto Mono", "Courier New", monospace' aria-label="macOS Terminal window: whoami Arijit Das, Backend + AI Engineer at American Chase"><style>@keyframes print{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,99%{opacity:0}100%{opacity:1}}
/* `backwards`, not `forwards`, and no resting opacity:0 -- a line's resting
   state is visible, and the keyframes only hold it hidden during its delay.
   With opacity:0 + forwards, any renderer that does not execute CSS shows an
   empty terminal; this way the session degrades to fully printed. */
.ln{animation:print .28s ease-out backwards}
.cur{animation:blink 1.06s steps(1,end) 1.25s infinite}
@media (prefers-reduced-motion:reduce){
  .ln{animation:none}
  .cur{animation:none;opacity:1}
